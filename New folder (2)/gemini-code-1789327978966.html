<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Serious Agreement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Will you go on a date with me?</h1>
        <p>Think carefully! This is a completely binding agreement.</p>
        
        <!-- Standard Image Tag referencing your file -->
        <img src="crush_photo.png" alt="Her picture" class="proposal-photo">

        <div class="button-area">
            <!-- The 'YES' button is functional -->
            <button class="accept-btn" id="yesButton" onclick="acceptProposal()">Yes, I accept!</button>
            
            <!-- The 'NO' buttons "won't work" -->
            <!-- One is just disabled (simplest non-working) -->
            <button class="reject-btn" disabled>No, I reject.</button>
            
            <!-- One will actively escape the mouse -->
            <button class="reject-btn escaping-btn" id="noButton" onmouseover="moveNoButton()">Maybe next time...</button>
        </div>

        <!-- This section is hidden until she accepts -->
        <div id="success-screen" style="display: none;">
            <h2>Yay! Check your phone! 😉</h2>
            <p>Wait, did you think this was real? (Probably... 😉)</p>
        </div>
    </div>

    <!-- The Javascript must be linked at the bottom -->
    <script src="script.js"></script>
</body>
</html>
