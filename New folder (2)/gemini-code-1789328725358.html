<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গুরুত্বপূর্ণ প্রশ্ন!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 500px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 30px;
            font-size: 28px;
            line-height: 1.4;
        }

        .crush-image {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #d81b60;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(216, 27, 96, 0.3);
        }

        .btn-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .next-btn, #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        .next-btn:hover, #yesBtn:hover {
            background-color: #45a049;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .success-img {
            max-width: 300px;
            border-radius: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Step 1: The Hook -->
    <div id="step1" class="screen active">
        <h1>শোনো, তোমাকে খুব গুরুত্বপূর্ণ একটা কথা বলার ছিল...</h1>
        <button class="next-btn" onclick="nextStep(2)">কী কথা?</button>
    </div>

    <!-- Step 2: The Compliment & Photo -->
    <div id="step2" class="screen">
        <!-- The image is now explicitly referencing your file name -->
        <img src="IMG_20260913_222317.jpg" alt="Beautiful" class="crush-image">
        <h1>এই ছবিটার দিকে তাকাও... তুমি আমার দেখা পৃথিবীর সবচেয়ে সুন্দর মেয়ে! 😍</h1>
        <button class="next-btn" onclick="nextStep(3)">তারপর বল...</button>
    </div>

    <!-- Step 3: The I Love You -->
    <div id="step3" class="screen">
        <h1>আমি তোমাকে অনেক ভালোবাসি! ❤️</h1>
        <button class="next-btn" onclick="nextStep(4)">সত্যি?</button>
    </div>

    <!-- Step 4: The Prank Question -->
    <div id="step4" class="screen">
        <h1>তাহলে, তুমি কি আমার সাথে ডেটে যাবে?</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="nextStep(5)">হ্যাঁ</button>
            <button id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">না</button>
        </div>
    </div>

    <!-- Step 5: Success -->
    <div id="step5" class="screen">
        <h1>আমি জানতাম তুমি 'হ্যাঁ' বলবে! 🎉😂</h1>
        <img src="https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif" alt="Happy Dance" class="success-img">
    </div>

    <script>
        function nextStep(stepNumber) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById('step' + stepNumber).classList.add('active');
        }

        function runAway() {
            const noBtn = document.getElementById('noBtn');
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
